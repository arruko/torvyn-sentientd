apiVersion: v1
kind: Service
metadata:
  name: sentientd
  namespace: sentientd
  labels:
    app.kubernetes.io/name: sentientd
    app.kubernetes.io/component: incident-management
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentientd
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  sessionAffinity: None
