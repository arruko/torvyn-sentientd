apiVersion: v1
kind: Secret
metadata:
  name: sentientd-secrets
  namespace: sentientd
  labels:
    app.kubernetes.io/name: sentientd
    app.kubernetes.io/component: incident-management
type: Opaque
stringData:
  # Database connection string
  # Format: postgres://user:password@host:5432/database?sslmode=require
  DATABASE_URL: "postgres://sentientd:CHANGEME@postgres.sentientd.svc.cluster.local:5432/sentientd?sslmode=require"

  # GitHub Personal Access Token or GitHub App credentials
  # Required for creating PRs for remediation plans
  GITHUB_TOKEN: "ghp_CHANGEME"

  # Slack webhook URL for notifications
  # Format: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/CHANGEME"
