name: dag-runner

on:
  pull_request:
    branches: [ "**" ]
    paths:
      - 'cmd/dag-runner/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pr-dag-runner.yml'

permissions:
  contents: read
  security-events: write

concurrency:
  group: pr-dag-runner-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/torvyn-dag-runner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build DAG Runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/dag-runner/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test DAG Runner container
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} --help

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build DAG Runner image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/dag-runner/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          load: true

      - name: Trivy scan DAG Runner (SARIF)
        id: trivy_sarif
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          format: 'sarif'
          output: 'trivy-dag-runner-results.sarif'
          severity: 'HIGH,CRITICAL'
          vuln-type: 'os,library'
          scanners: 'vuln,misconfig,secret,license'
          trivyignores: '.trivyignore.yaml'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: steps.trivy_sarif.outcome == 'success'
        continue-on-error: true
        with:
          sarif_file: 'trivy-dag-runner-results.sarif'

      - name: Trivy scan DAG Runner (table)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,misconfig'
          exit-code: '1'
          trivyignores: '.trivyignore.yaml'

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build DAG Runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/dag-runner/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          load: true

      - name: Run DAG Runner smoke test
        run: |
          # Test container starts and shows usage
          echo "Testing --help flag..."
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} --help 2>&1 | grep -q "Usage of" && echo "✅ Help flag works" || exit 1

          # Verify non-root user
          echo "Verifying non-root user..."
          USER_ID=$(docker run --rm --entrypoint sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} -c "id -u")
          if [ "$USER_ID" != "1000" ]; then
            echo "❌ Container running as UID $USER_ID, expected 1000"
            exit 1
          fi
          echo "✅ Container runs as non-root user (UID 1000)"

          # Verify kubectl is available (needed for k8s.* tools)
          echo "Verifying kubectl availability..."
          docker run --rm --entrypoint kubectl ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} version --client 2>&1 | grep -q "Client Version" && echo "✅ kubectl is available" || exit 1

          # Verify binary is executable and has correct permissions
          echo "Verifying binary permissions..."
          PERMS=$(docker run --rm --entrypoint sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} -c "stat -c '%a' /app/dag-runner")
          if [ "$PERMS" = "555" ]; then
            echo "✅ Binary has correct permissions (555)"
          else
            echo "❌ Binary permissions are $PERMS, expected 555"
            exit 1
          fi

          echo ""
          echo "✅ All smoke tests passed!"
